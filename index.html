<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plugalogue Sandbox | Coming Soon</title>
    <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
    <style>
        body {
            background-color: #0f1115; /* Deep dark background */
            color: #e2e8f0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .hero-glow {
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(99,102,241,0.1) 0%, rgba(15,17,21,0) 70%);
            z-index: -1;
            pointer-events: none;
        }
    </style>
</head>
<body class="antialiased overflow-x-hidden relative min-h-screen flex flex-col">

    <div class="hero-glow"></div>



    <!-- Hero Section -->
    <main class="max-w-7xl mx-auto px-6 pt-16 pb-24 text-center relative z-10 flex-grow">
        
        <!-- Pure CSS Logo Recreation -->
        <div class="flex flex-col items-center justify-center mb-16 select-none cursor-default hover:scale-105 transition duration-500">
            <!-- Top Line: Plugalogue -->
            <div class="text-[5rem] md:text-[7rem] font-black tracking-tighter text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-blue-500 to-purple-500 pb-2 md:pb-4 pr-4 leading-normal drop-shadow-2xl" style="text-shadow: 0 0 40px rgba(99,102,241,0.3);">
                Plugalogue&nbsp;</div>
            
            <!-- Bottom Line: SANDBOX PRO -->
            <div class="flex items-center justify-center gap-4 mt-1 md:-mt-2 md:ml-32">
                <!-- SANDBOX Pill -->
                <div class="px-4 py-1 border-[3px] border-cyan-400 rounded-full text-cyan-400 font-bold tracking-[0.2em] text-xl md:text-3xl" style="box-shadow: 0 0 15px rgba(34,211,238,0.3), inset 0 0 10px rgba(34,211,238,0.2); text-shadow: 0 0 10px rgba(34,211,238,0.5);">
                    SANDBOX
                </div>
                <!-- PRO Text -->
                <div class="text-purple-400 font-black tracking-widest text-2xl md:text-4xl" style="text-shadow: 0 0 15px rgba(192,132,252,0.6);">
                    PRO
                </div>
            </div>
        </div>
        
        <div class="mt-10 flex justify-center">
            <div class="px-10 py-4 bg-indigo-600/20 text-indigo-300 font-semibold rounded-full border border-indigo-500/30 cursor-not-allowed flex items-center justify-center gap-3 tracking-wide">
                <span class="w-2 h-2 rounded-full bg-indigo-400 animate-pulse"></span>
                COMING SOON
            </div>
        </div>

        <!-- Blurred App Screenshot Teaser -->
        <div class="mt-20 relative mx-auto w-full max-w-6xl">
            <div class="absolute -inset-1 bg-gradient-to-r from-indigo-500 to-cyan-500 rounded-2xl blur-xl opacity-20"></div>
            <div class="relative bg-black ring-1 ring-white/10 rounded-2xl overflow-hidden shadow-2xl">
                <!-- Using the new user uploaded image, applying Tailwind blur -->
                <img src="images/screenshot.png" alt="Plugalogue Sandbox Teaser" class="w-full object-cover blur-sm opacity-60 transition duration-1000 hover:blur-none hover:opacity-100 cursor-pointer">
                
                <!-- Overlay Gradient to fade it into the background -->
                <div class="absolute inset-0 bg-gradient-to-t from-[#0f1115] via-transparent to-transparent pointer-events-none"></div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="py-8 border-t border-white/5 text-center mt-auto">
        <p class="text-slate-600 text-sm">© 2026 Plugalogue. All rights reserved.</p>
    </footer>

</body>
</html>
